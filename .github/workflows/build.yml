                    class FormPage extends StatefulWidget {
            final String t;
            final String? id;
            const FormPage(this.t, this.id, {super.key});
            @override
            State<FormPage> createState() => _FormS();
          }
          class _FormS extends State<FormPage> {
            late M o;
            final ctl = <String, TextEditingController>{};

            @override
            void initState() {
              super.initState();
              o = widget.id == null ? <String, dynamic>{'id': uid()} : Map<String, dynamic>.from(find(widget.t, widget.id));
              for (final f in F[widget.t]!) {
                final k = f[0] as String, ty = f.length > 2 ? f[2] as String : 'text';
                if (ty == 'select') {
                  final op = f[3] as List;
                  if (!op.contains(o[k])) o[k] = op.first;
                } else if (ty == 'ref') {
                  if (find(f[3] as String, o[k]).isEmpty) o[k] = null;
                } else if (ty != 'img') {
                  ctl[k] = TextEditingController(text: '${o[k] ?? (k == 'date' ? today() : '')}');
                }
              }
            }

            Future<void> pickImg(String k, ImageSource s) async {
              final x = await ImagePicker().pickImage(source: s, maxWidth: 900, imageQuality: 70);
              if (x == null) return;
              final b = await x.readAsBytes();
              setState(() => o[k] = base64Encode(b));
            }

            Future<void> save() async {
              for (final f in F[widget.t]!) {
                final k = f[0] as String, ty = f.length > 2 ? f[2] as String : 'text';
                if (ctl.containsKey(k)) {
                  final v = ctl[k]!.text.trim();
                  o[k] = ty == 'number' ? (v.isEmpty ? '' : (num.tryParse(v) ?? '')) : v;
                }
              }
              if (widget.t == 'trips') {
                final cr = find('cars', o['carId']);
                if (cr.isNotEmpty && nn(o['endKm']) > nn(cr['odo'])) cr['odo'] = nn(o['endKm']);
              }
              final l = L(widget.t);
              final i = l.indexWhere((x) => x['id'] == o['id']);
              if (i >= 0) { l[i] = o; } else { l.add(o); }
              await saveDb();
              if (mounted) Navigator.pop(context);
            }

            Widget field(BuildContext c, List f) {
              final k = f[0] as String, lab = f[1] as String, ty = f.length > 2 ? f[2] as String : 'text';
              final dec = InputDecoration(labelText: lab, border: const OutlineInputBorder());
              Widget w;
              if (ty == 'select') {
                w = DropdownButtonFormField<String>(
                    value: o[k] as String?, decoration: dec,
                    items: [for (final x in f[3] as List) DropdownMenuItem<String>(value: '$x', child: Text('$x'))],
                    onChanged: (v) => setState(() => o[k] = v));
              } else if (ty == 'ref') {
                w = DropdownButtonFormField<String?>(
                    value: o[k] as String?, decoration: dec,
                    items: [
                      const DropdownMenuItem<String?>(value: null, child: Text('—')),
                      for (final x in L(f[3] as String).cast<M>()) DropdownMenuItem<String?>(value: x['id'] as String, child: Text('${x['reg'] ?? x['name']}')),
                    ],
                    onChanged: (v) => setState(() => o[k] = v));
              } else if (ty == 'date') {
                w = TextField(
                    controller: ctl[k], readOnly: true,
                    decoration: InputDecoration(labelText: lab, border: const OutlineInputBorder(), suffixIcon: IconButton(icon: const Icon(Icons.clear), onPressed: () => ctl[k]!.clear())),
                    onTap: () async {
                      final d = await showDatePicker(context: c, initialDate: DateTime.tryParse(ctl[k]!.text) ?? DateTime.now(), firstDate: DateTime(2015), lastDate: DateTime(2100));
                      if (d != null) ctl[k]!.text = d.toIso8601String().substring(0, 10);
                    });
              } else if (ty == 'img') {
                final has = '${o[k] ?? ''}'.isNotEmpty;
                w = Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(lab, style: const TextStyle(color: Colors.grey)),
                  const SizedBox(height: 6),
                  if (has) ...[photo(o[k], w: double.infinity, h: 180), const SizedBox(height: 6)],
                  Wrap(spacing: 8, children: [
                    OutlinedButton.icon(onPressed: () => pickImg(k, ImageSource.camera), icon: const Icon(Icons.photo_camera), label: const Text('Camera')),
                    OutlinedButton.icon(onPressed: () => pickImg(k, ImageSource.gallery), icon: const Icon(Icons.photo_library), label: const Text('Gallery')),
                    if (has) TextButton(onPressed: () => setState(() => o[k] = ''), child: const Text('Remove')),
                  ]),
                ]);
              } else {
                w = TextField(
                    controller: ctl[k], decoration: dec,
                    keyboardType: ty == 'number' ? const TextInputType.numberWithOptions(decimal: true) : ty == 'tel' ? TextInputType.phone : TextInputType.text);
              }
              return Padding(padding: const EdgeInsets.only(top: 12), child: w);
            }

            @override
            Widget build(BuildContext c) => Scaffold(
                  appBar: AppBar(title: Text('${widget.id == null ? 'Add' : 'Edit'} ${widget.t}'), actions: [TextButton(onPressed: save, child: const Text('SAVE', style: TextStyle(color: Colors.white)))]),
                  body: ListView(padding: const EdgeInsets.all(16), children: [
                    for (final f in F[widget.t]!) field(c, f),
                    const SizedBox(height: 16),
                    FilledButton(onPressed: save, child: const Text('Save')),
                    const SizedBox(height: 30),
                  ]),
                );
          }
